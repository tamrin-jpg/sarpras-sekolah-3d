  <style>
    /* Tactile 3D Claymorphism & Vibrant Menu Design System */
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 10% 10%, #eef2ff 0%, #f8fafc 45%, #ecfeff 100%);
      color: #0f172a;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .font-display {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* 3D Elevated Card */
    .card-3d {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-radius: 1.5rem;
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow:
        0 10px 25px -5px rgba(15, 23, 42, 0.08),
        0 6px 0 0 #e2e8f0,
        inset 0 2px 4px rgba(255, 255, 255, 0.9);
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease;
    }

    .card-3d-hover:hover {
      transform: translateY(-4px);
      box-shadow:
        0 18px 30px -8px rgba(15, 23, 42, 0.12),
        0 8px 0 0 #cbd5e1,
        inset 0 2px 4px rgba(255, 255, 255, 1);
    }

    /* 3D Tactile Buttons */
    .btn-3d {
      border-radius: 1rem;
      font-weight: 700;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
    }

    .btn-3d:active {
      transform: translateY(3px);
    }

    /* Menu Color Themes (3D Gradients + Thick 3D Bottom Lip) */
    .theme-blue {
      background: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
      color: #ffffff;
      box-shadow: 0 5px 0 0 #1d4ed8, 0 10px 20px -5px rgba(37, 99, 235, 0.45);
    }
    .theme-blue:active { box-shadow: 0 2px 0 0 #1d4ed8; }

    .theme-emerald {
      background: linear-gradient(135deg, #059669 0%, #14b8a6 100%);
      color: #ffffff;
      box-shadow: 0 5px 0 0 #047857, 0 10px 20px -5px rgba(5, 150, 105, 0.45);
    }
    .theme-emerald:active { box-shadow: 0 2px 0 0 #047857; }

    .theme-amber {
      background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
      color: #ffffff;
      box-shadow: 0 5px 0 0 #c2410c, 0 10px 20px -5px rgba(249, 115, 22, 0.45);
    }
    .theme-amber:active { box-shadow: 0 2px 0 0 #c2410c; }

    .theme-purple {
      background: linear-gradient(135deg, #7c3aed 0%, #d946ef 100%);
      color: #ffffff;
      box-shadow: 0 5px 0 0 #5b21b6, 0 10px 20px -5px rgba(124, 58, 237, 0.45);
    }
    .theme-purple:active { box-shadow: 0 2px 0 0 #5b21b6; }

    .theme-rose {
      background: linear-gradient(135deg, #e11d48 0%, #ec4899 100%);
      color: #ffffff;
      box-shadow: 0 5px 0 0 #be123c, 0 10px 20px -5px rgba(225, 29, 72, 0.45);
    }
    .theme-rose:active { box-shadow: 0 2px 0 0 #be123c; }

    .theme-indigo {
      background: linear-gradient(135deg, #4338ca 0%, #6366f1 100%);
      color: #ffffff;
      box-shadow: 0 5px 0 0 #312e81, 0 10px 20px -5px rgba(67, 56, 202, 0.45);
    }
    .theme-indigo:active { box-shadow: 0 2px 0 0 #312e81; }

    .theme-slate {
      background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
      color: #334155;
      border: 2px solid #e2e8f0;
      box-shadow: 0 4px 0 0 #cbd5e1;
    }
    .theme-slate:active { box-shadow: 0 1px 0 0 #cbd5e1; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Modal Entrance Animation */
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.94) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop-in {
      animation: popIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Print Stylesheet for Official A4 Letter & Inventory Asset Cards */
    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      .no-print {
        display: none !important;
      }
      body.print-card-mode main {
        display: none !important;
      }
      body.print-card-mode #card-print-sheet {
        display: block !important;
        width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      #print-area-wrapper {
        position: static !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
      #printable-letter {
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 100% !important;

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showToast(title, message, type = "success") {
      const container = document.getElementById("toast-container");
      const styles = {
        success: "border-emerald-400 bg-emerald-50 text-emerald-950",
        error: "border-rose-400 bg-rose-50 text-rose-950",
        info: "border-blue-400 bg-blue-50 text-blue-950",
        warning: "border-amber-400 bg-amber-50 text-amber-950"
      };
      const toast = document.createElement("div");
      toast.className = `pointer-events-auto card-3d p-4 border-2 ${styles[type] || styles.success} animate-pop-in`;
      toast.innerHTML = `
        <div class="flex items-start justify-between gap-3">
          <div>
            <h4 class="font-display font-bold text-sm">${escapeHtml(title)}</h4>
            <p class="text-xs mt-0.5 opacity-90">${escapeHtml(message)}</p>
          </div>
          <button type="button" class="text-slate-400 hover:text-slate-700 font-bold text-base leading-none">&times;</button>
        </div>
      `;
      toast.querySelector("button").onclick = () => toast.remove();
      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentNode) toast.remove();
      }, 4200);
    }

    function openModal(htmlContent, maxWidthClass = "max-w-2xl") {
      const root = document.getElementById("modal-root");
      const box = document.getElementById("modal-box");
      box.className = `card-3d w-full ${maxWidthClass} p-6 sm:p-7 my-8 animate-pop-in relative`;
      box.innerHTML = htmlContent;
      root.classList.remove("hidden");
      root.classList.add("flex");
    }

    function closeModal() {
      const root = document.getElementById("modal-root");
      const box = document.getElementById("modal-box");
      root.classList.add("hidden");
      root.classList.remove("flex");
      box.innerHTML = "";
    }

      if (!isoStr) return "-";
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return isoStr;
      return d.toLocaleString("id-ID", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function formatDateFullID(isoStr) {
      const d = isoStr ? new Date(isoStr) : new Date();
      if (isNaN(d.getTime())) return "-";
      return d.toLocaleDateString("id-ID", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    // Kompresi & Upload Foto Inventaris (Firebase Storage + Fallback ObjectURL tanpa Base64)
    function compressImageToBlob(file, maxWidth = 900, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const objectUrl = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          URL.revokeObjectURL(objectUrl);

          canvas.toBlob(
            (blob) => {
              if (blob) resolve(blob);
              else reject(new Error("Gagal memproses gambar."));
            },
            "image/jpeg",
            quality
          );
        };
        img.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error("File gambar tidak valid."));
        };
        img.src = objectUrl;
      });
    }

    async function uploadInventoryPhoto(file) {
      const compressedBlob = await compressImageToBlob(file);
      if (!state.isDemoMode && state.storage && state.currentUser && state.fsModules) {
        try {
          const { storageRef, uploadBytes, getDownloadURL } = state.fsModules;
          const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
          const path = `artifacts/${appId}/public/inventory/${Date.now()}_${safeName}.jpg`;
          const fileRef = storageRef(state.storage, path);
          await uploadBytes(fileRef, compressedBlob, { contentType: "image/jpeg" });
          return await getDownloadURL(fileRef);
        } catch (err) {
          console.warn("Firebase Storage belum aktif, menggunakan URL pratinjau lokal:", err);
          showToast(
            "Info Penyimpanan Foto",
            "Foto dimuat dengan pratinjau sesi lokal. Aktifkan Firebase Storage di Console untuk menyimpan permanen.",
            "info"
          );
          return URL.createObjectURL(compressedBlob);
        }
      }
      return URL.createObjectURL(compressedBlob);
    }

    // Generator Barcode Vector SVG untuk Kartu Inventaris Barang
    function generateBarcodeSVG(codeText) {
      const str = String(codeText || "INV-SARPRAS");
      let bars = "";
      let x = 2;
      for (let i = 0; i < str.length; i++) {
        const charCode = str.charCodeAt(i);
        const w1 = (charCode % 3) + 1;
        const gap = ((charCode >> 2) % 2) + 1.5;
        const w2 = ((charCode >> 4) % 2) + 1.5;
        bars += `<rect x="${x}" y="0" width="${w1}" height="28" fill="#0f172a"/>`;
        x += w1 + gap;
        bars += `<rect x="${x}" y="0" width="${w2}" height="28" fill="#0f172a"/>`;
        x += w2 + 2;
      }
      return `<svg viewBox="0 0 ${Math.max(80, x + 2)} 28" class="h-7 w-auto mx-auto" preserveAspectRatio="none">${bars}</svg>`;
    }

    // =========================================================================
    // 5. INISIALISASI FIREBASE & SINKRONISASI REALTIME (DYNAMIC SAFE IMPORT)
    // =========================================================================
    async function initFirebaseBackend() {
      const statusDot = document.getElementById("sidebar-status-dot");
      const statusText = document.getElementById("sidebar-status-text");

      const isPlaceholderConfig =
        !firebaseConfig ||
        !firebaseConfig.apiKey ||
        firebaseConfig.apiKey === "GANTI_DENGAN_API_KEY_ANDA";

      if (isPlaceholderConfig) {
        enableDemoMode("Mode Simulasi Aktif (Kunci Firebase belum diisi).");
        return;
      }

      try {
        const [appMod, authMod, fsMod, stMod] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"),
          import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"),
          import("https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js")
        ]);

        state.fsModules = {
          doc: fsMod.doc,
          setDoc: fsMod.setDoc,
          addDoc: fsMod.addDoc,
          updateDoc: fsMod.updateDoc,
          deleteDoc: fsMod.deleteDoc,
          onSnapshot: fsMod.onSnapshot,
          collection: fsMod.collection,
          storageRef: stMod.ref,
          uploadBytes: stMod.uploadBytes,
          getDownloadURL: stMod.getDownloadURL
        };

        const app = appMod.initializeApp(firebaseConfig);
        state.auth = authMod.getAuth(app);
        state.db = fsMod.getFirestore(app);
        state.storage = stMod.getStorage(app);

        if (typeof __initial_auth_token !== "undefined" && __initial_auth_token) {
          await authMod.signInWithCustomToken(state.auth, __initial_auth_token);
        } else {
          await authMod.signInAnonymously(state.auth);
        }

        state.currentUser = state.auth.currentUser;
        state.isDemoMode = false;

        if (statusDot) {
          statusDot.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span> Terhubung`;
          statusDot.className = "inline-flex items-center gap-1.5 text-xs font-bold text-emerald-600";
        }
        if (statusText) {
          statusText.textContent = "Cloud Firestore aktif & tersinkronisasi realtime.";
        }

        attachFirestoreListeners();
      } catch (err) {
        console.error("Gagal inisialisasi Firebase:", err);
        enableDemoMode("Beralih ke Mode Simulasi Lokal (Offline/Sandbox).");
      }
    }

    function attachFirestoreListeners() {
      if (!state.db || !state.currentUser || !state.fsModules) return;
      const { doc, onSnapshot, collection } = state.fsModules;

      const invCol = collection(state.db, "artifacts", appId, "public", "data", "inventory");
      onSnapshot(
        invCol,
        (snapshot) => {
          state.inventory = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
          state.inventory.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
          renderCurrentView();
        },
        (error) => console.error("Error listener inventaris:", error)
      );

      const loanCol = collection(state.db, "artifacts", appId, "public", "data", "loans");
      onSnapshot(
        loanCol,
        (snapshot) => {
          state.loans = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
          state.loans.sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
          if (!state.selectedLetterLoanId && state.loans.length > 0) {
            state.selectedLetterLoanId = state.loans[0].id;
          }
          renderCurrentView();
        },
        (error) => console.error("Error listener peminjaman:", error)
      );

      const settingsDoc = doc(state.db, "artifacts", appId, "public", "data", "settings", "general");
      onSnapshot(
        settingsDoc,
        (docSnap) => {
          if (docSnap.exists()) {
            state.settings = { ...state.settings, ...docSnap.data() };
            updateHeaderSchoolBadge();
            renderCurrentView();
          }
        },
        (error) => console.error("Error listener settings:", error)
      );
    }

    async function saveInventoryItem(data, existingId = null) {
      const payload = {
        code: data.code.trim(),
        name: data.name.trim(),
        category: data.category,
        totalQty: Math.max(1, parseInt(data.totalQty, 10) || 1),
        availableQty: Math.max(0, Math.min(parseInt(data.totalQty, 10) || 1, parseInt(data.availableQty, 10) || 0)),
        condition: data.condition,
        location: data.location.trim(),
        imageUrl: (data.imageUrl || "").trim(),
        description: (data.description || "").trim(),
        updatedAt: new Date().toISOString()
      };

      if (state.isDemoMode) {
        if (existingId) {
          const idx = state.inventory.findIndex((i) => i.id === existingId);
          if (idx > -1) state.inventory[idx] = { ...state.inventory[idx], ...payload };
        } else {
          state.inventory.unshift({ id: "inv-" + Date.now(), ...payload });
        }
        renderCurrentView();
        showToast("Berhasil Disimpan", `Data inventaris "${payload.name}" diperbarui.`);
        return;
      }

      try {
        const { doc, addDoc, updateDoc, collection } = state.fsModules;
        if (existingId) {
          const ref = doc(state.db, "artifacts", appId, "public", "data", "inventory", existingId);
          await updateDoc(ref, payload);
        } else {
          const col = collection(state.db, "artifacts", appId, "public", "data", "inventory");
          await addDoc(col, payload);
        }
        showToast("Tersimpan ke Cloud", `Inventaris "${payload.name}" berhasil disimpan.`);
      } catch (err) {
        console.error(err);
        showToast("Gagal Menyimpan", err.message, "error");
      }
    }

    async function deleteInventoryItem(item) {
      if (state.isDemoMode) {
        state.inventory = state.inventory.filter((i) => i.id !== item.id);
        renderCurrentView();
        showToast("Item Dihapus", `"${item.name}" telah dihapus dari inventaris.`, "warning");
        return;
      }
      try {
        const { doc, deleteDoc } = state.fsModules;
        const ref = doc(state.db, "artifacts", appId, "public", "data", "inventory", item.id);
        await deleteDoc(ref);
        showToast("Item Dihapus", `"${item.name}" berhasil dihapus dari Cloud.`, "warning");
      } catch (err) {
        showToast("Gagal Menghapus", err.message, "error");
      }
    }

    async function adjustInventoryStock(itemId, delta) {
      const target = state.inventory.find((i) => i.id === itemId);
      if (!target) return;
      const nextAvail = Math.max(0, Math.min(target.totalQty, (Number(target.availableQty) || 0) + delta));

      if (state.isDemoMode) {
        target.availableQty = nextAvail;
        return;
      }
      try {
        const { doc, updateDoc } = state.fsModules;
        const ref = doc(state.db, "artifacts", appId, "public", "data", "inventory", itemId);
        await updateDoc(ref, { availableQty: nextAvail });
      } catch (err) {
        console.error("Gagal menyesuaikan stok:", err);
      }
    }

    async function saveLoan(data, existingId = null) {
      const selectedInv = state.inventory.find((i) => i.id === data.itemId);
      const qty = Math.max(1, parseInt(data.quantity, 10) || 1);
      const prevLoan = existingId ? state.loans.find((l) => l.id === existingId) : null;

      const payload = {
        letterNumber: data.letterNumber.trim(),
        borrowerName: data.borrowerName.trim(),
        borrowerNip: (data.borrowerNip || "").trim(),
        borrowerSubject: (data.borrowerSubject || "").trim(),
        borrowerPhone: (data.borrowerPhone || "").trim(),
        loanType: data.loanType,
        itemId: data.itemId,
        itemName: selectedInv ? selectedInv.name : data.itemName || "Item Sarpras",
        quantity: qty,
        startTime: data.startTime,
        endTime: data.endTime,
        purpose: data.purpose.trim(),
        status: data.status,
        createdAt: prevLoan ? prevLoan.createdAt : new Date().toISOString()
      };

      const wasActive = prevLoan && prevLoan.status === "Disetujui / Aktif";
      const isNowActive = payload.status === "Disetujui / Aktif";

      if (!wasActive && isNowActive && payload.itemId) {
        await adjustInventoryStock(payload.itemId, -qty);
      } else if (wasActive && !isNowActive && prevLoan.itemId) {
        await adjustInventoryStock(prevLoan.itemId, prevLoan.quantity);
      }

      if (state.isDemoMode) {
        if (existingId) {
          const idx = state.loans.findIndex((l) => l.id === existingId);
          if (idx > -1) state.loans[idx] = { ...state.loans[idx], ...payload };
        } else {
          const newId = "loan-" + Date.now();
          state.loans.unshift({ id: newId, ...payload });
          state.selectedLetterLoanId = newId;
        }
        renderCurrentView();
        showToast("Peminjaman Tersimpan", `Surat ${payload.letterNumber} berhasil dicatat.`);
        return;
      }

      try {
        const { doc, addDoc, updateDoc, collection } = state.fsModules;
        if (existingId) {
          const ref = doc(state.db, "artifacts", appId, "public", "data", "loans", existingId);
          await updateDoc(ref, payload);
        } else {
          const col = collection(state.db, "artifacts", appId, "public", "data", "loans");
          const created = await addDoc(col, payload);
          state.selectedLetterLoanId = created.id;
        }
        showToast("Peminjaman Tersimpan", `Data peminjaman oleh ${payload.borrowerName} berhasil disimpan.`);
      } catch (err) {
        showToast("Gagal Menyimpan Peminjaman", err.message, "error");
      }
    }

    async function quickUpdateLoanStatus(loanId, nextStatus) {
      const loan = state.loans.find((l) => l.id === loanId);
      if (!loan) return;
      await saveLoan({ ...loan, status: nextStatus }, loanId);
    }

    async function deleteLoan(loan) {
      if (loan.status === "Disetujui / Aktif" && loan.itemId) {
        await adjustInventoryStock(loan.itemId, loan.quantity);
      }
      if (state.isDemoMode) {
        state.loans = state.loans.filter((l) => l.id !== loan.id);
        renderCurrentView();
        showToast("Transaksi Dihapus", `Peminjaman ${loan.letterNumber} telah dihapus.`, "warning");
        return;
      }
      try {
        const { doc, deleteDoc } = state.fsModules;
        const ref = doc(state.db, "artifacts", appId, "public", "data", "loans", loan.id);
        await deleteDoc(ref);
        showToast("Transaksi Dihapus", `Peminjaman ${loan.letterNumber} dihapus dari Cloud.`, "warning");
      } catch (err) {
        showToast("Gagal Menghapus", err.message, "error");
      }
    }

    async function saveSettings(newSettings) {
      state.settings = { ...state.settings, ...newSettings };
      updateHeaderSchoolBadge();

      if (state.isDemoMode) {
        renderCurrentView();
        showToast("Pengaturan Disimpan", "Identitas instansi & akun admin diperbarui.");
        return;
      }

      try {
        const { doc, setDoc } = state.fsModules;
        const settingsDoc = doc(state.db, "artifacts", appId, "public", "data", "settings", "general");
        await setDoc(settingsDoc, state.settings, { merge: true });
        showToast("Pengaturan Tersimpan", "Konfigurasi Sarpras tersimpan ke Firebase Cloud.");
      } catch (err) {
        showToast("Gagal Menyimpan Setting", err.message, "error");
      }
    }

    async function seedSampleDataToDatabase() {
      loadDefaultSampleData();
      if (state.isDemoMode) {
        renderCurrentView();
        showToast("Data Simulasi Dimuat", "5 item inventaris & 3 transaksi peminjaman ditambahkan.");
        return;
      }

      try {
        const { addDoc, collection } = state.fsModules;
        const invCol = collection(state.db, "artifacts", appId, "public", "data", "inventory");
        const createdInvIds = [];
        for (const item of state.inventory) {
          const { id, ...cleanItem } = item;
          const docRef = await addDoc(invCol, cleanItem);
          createdInvIds.push({ id: docRef.id, name: cleanItem.name });
        }

        const loanCol = collection(state.db, "artifacts", appId, "public", "data", "loans");
        for (let i = 0; i < state.loans.length; i++) {
          const { id, ...cleanLoan } = state.loans[i];
          if (createdInvIds[i]) {
            cleanLoan.itemId = createdInvIds[i].id;
            cleanLoan.itemName = createdInvIds[i].name;
          }
          await addDoc(loanCol, cleanLoan);
        }
        showToast("Seed Berhasil", "Data contoh Sarpras berhasil diunggah ke Firestore!");
      } catch (err) {
        showToast("Gagal Seed Data", err.message, "error");
      }
    }

    function renderSidebar() {
      const nav = document.getElementById("sidebar-nav");
      nav.innerHTML = MENUS.map((menu) => {
        const isActive = state.activeMenu === menu.id;
        return `
          <button
            type="button"
            data-menu-id="${menu.id}"
            class="w-full text-left px-4 py-3.5 rounded-2xl flex items-center gap-3.5 transition-all duration-150 ${
              isActive
                ? `${menu.theme} scale-[1.02]`
                : "bg-slate-50/90 hover:bg-slate-100 text-slate-700 border-2 border-slate-200/80"
            }"
          >
            <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${
              isActive ? "bg-white/20 text-white" : `${menu.theme}`
            }">
              ${menu.icon}
            </div>
            <div class="min-w-0 flex-1">
              <div class="text-[10px] font-extrabold uppercase tracking-wider ${
                isActive ? "text-white/80" : "text-slate-400"
              }">Menu ${menu.number}</div>
              <div class="font-display font-bold text-sm truncate">${menu.title}</div>
            </div>
          </button>
        `;
      }).join("");

      nav.querySelectorAll("button[data-menu-id]").forEach((btn) => {
        btn.onclick = () => {
          setActiveMenu(btn.getAttribute("data-menu-id"));
          closeMobileSidebar();
        };
      });
    }

    function setActiveMenu(menuId) {
      state.activeMenu = menuId;
      const current = MENUS.find((m) => m.id === menuId) || MENUS[0];

      const iconBox = document.getElementById("header-menu-icon");
      iconBox.className = `w-12 h-12 rounded-2xl ${current.theme} flex items-center justify-center shrink-0`;
      iconBox.innerHTML = current.icon;

      document.getElementById("header-menu-title").textContent = current.title;
      document.getElementById("header-menu-subtitle").textContent = current.subtitle;
      document.getElementById("mobile-subtitle").textContent = current.title;

      const badge = document.getElementById("header-school-badge");
      badge.className = `px-2.5 py-0.5 rounded-full text-xs font-bold ${current.badgeBg}`;
      badge.textContent = state.settings.schoolName;

      renderSidebar();
      renderCurrentView();
    }

    function updateHeaderSchoolBadge() {
      const badge = document.getElementById("header-school-badge");
      if (badge) badge.textContent = state.settings.schoolName;
    }

    function openMobileSidebar() {
      document.getElementById("sidebar").classList.remove("-translate-x-full");
      document.getElementById("sidebar-backdrop").classList.remove("hidden");
    }

    function closeMobileSidebar() {
      document.getElementById("sidebar").classList.add("-translate-x-full");
      document.getElementById("sidebar-backdrop").classList.add("hidden");
    }

    function renderCurrentView() {
      const viewContainer = document.getElementById("app-view");
      if (!viewContainer) return;

      switch (state.activeMenu) {
        case "inventaris":
          viewContainer.innerHTML = renderInventarisView();
          bindInventarisEvents();
          break;
        case "peminjaman":
          viewContainer.innerHTML = renderPeminjamanView();
          bindPeminjamanEvents();
          break;
        case "surat":
          viewContainer.innerHTML = renderSuratView();
          bindSuratEvents();
          break;
        case "realtime":
          viewContainer.innerHTML = renderRealtimeView();
          bindRealtimeEvents();
          break;
        case "galeri":
          viewContainer.innerHTML = renderGaleriView();
          bindGaleriEvents();
          break;
        case "setting":
          viewContainer.innerHTML = renderSettingView();
          bindSettingEvents();
          break;
      }
    }

                                    🪪 Kartu
                                  </button>
                                  ${
                                    state.isAdminLoggedIn
                                      ? `<button type="button" data-edit-inv="${item.id}" class="btn-3d theme-slate px-3 py-1.5 text-xs">Edit</button>
                                         <button type="button" data-del-inv="${item.id}" class="btn-3d theme-rose px-3 py-1.5 text-xs">Hapus</button>`

                            </tr>

                }

            </div>
            <div>
              <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Unit Tersedia</label>
              <input name="availableQty" type="number" min="0" required value="${editItem ? editItem.availableQty : 1}" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none text-sm font-bold" />

            <div>
              <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Kondisi Fisik</label>
              <select name="condition" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none text-sm font-semibold bg-white">
                ${["Baik", "Rusak Ringan", "Rusak Berat"]
                  .map((cond) => `<option value="${cond}" ${editItem && editItem.condition === cond ? "selected" : ""}>${cond}</option>`)
                  .join("")}
              </select>

          </div>

          <div>

          </div>

          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Spesifikasi / Keterangan</label>
            <textarea name="description" rows="2" placeholder="Catatan kelengkapan aksesori, merek, atau kondisi..." class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none text-sm">${escapeHtml(editItem ? editItem.description || "" : "")}</textarea>
          </div>

          <div class="flex justify-end gap-3 pt-3 border-t border-slate-200">
            <button type="button" id="cancel-inv-modal" class="btn-3d theme-slate px-5 py-2.5 text-sm">Batal</button>
            <button type="submit" id="submit-inv-btn" class="btn-3d theme-blue px-6 py-2.5 text-sm">${isEdit ? "Simpan Perubahan" : "Simpan Inventaris"}</button>
          </div>
        </form>
      `);

      const previewBox = document.getElementById("inv-photo-preview-box");
      const fileInput = document.getElementById("inv-photo-file");
      const urlInput = document.getElementById("inv-image-url-input");
      const clearBtn = document.getElementById("btn-clear-inv-photo");
      const statusText = document.getElementById("inv-upload-status");
      const submitBtn = document.getElementById("submit-inv-btn");

      const updatePreviewDisplay = (url) => {
        if (url && url.trim().length > 4) {
          previewBox.innerHTML = `<img src="${escapeHtml(url)}" alt="Preview" class="w-full h-full object-cover" />`;
          clearBtn.classList.remove("hidden");
        } else {
          previewBox.innerHTML = `<span class="text-xs font-bold text-slate-400 text-center px-2">Belum Ada Foto</span>`;
          clearBtn.classList.add("hidden");
        }
      };

      fileInput.onchange = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        statusText.textContent = "⏳ Mengompresi & mengunggah foto...";
        submitBtn.disabled = true;
        try {
          const finalUrl = await uploadInventoryPhoto(file);
          urlInput.value = finalUrl;
          updatePreviewDisplay(finalUrl);
          statusText.textContent = "✓ Foto berhasil siap disimpan!";
        } catch (err) {
          statusText.textContent = "✕ Gagal memproses file gambar.";
          showToast("Gagal Upload Foto", err.message || "File tidak dapat diproses.", "error");
        } finally {
          submitBtn.disabled = false;
        }
      };

      urlInput.oninput = (e) => updatePreviewDisplay(e.target.value);

      clearBtn.onclick = () => {
        urlInput.value = "";
        fileInput.value = "";
        updatePreviewDisplay("");
        statusText.textContent = "Foto dihapus.";
      };

      document.getElementById("close-inv-modal").onclick = closeModal;
      document.getElementById("cancel-inv-modal").onclick = closeModal;
      document.getElementById("form-inventory").onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = Object.fromEntries(fd.entries());
        closeModal();
        await saveInventoryItem(data, editItem ? editItem.id : null);
      };
    }

    function openInventoryCardPrintModal(itemsToPrint) {
      if (!itemsToPrint || itemsToPrint.length === 0) return;
      const cardsGridHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          ${itemsToPrint.map((it) => buildInventoryCardHTML(it)).join("")}
        </div>
      `;

      openModal(`
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 pb-3 border-b border-slate-200">
          <div>
            <h3 class="font-display font-extrabold text-xl text-slate-900">Pratinjau Kartu Inventaris Barang (${itemsToPrint.length} Kartu)</h3>
            <p class="text-xs text-slate-500">Siap dicetak pada kertas A4 / stiker label untuk ditempel pada barang & ruangan.</p>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" id="btn-execute-card-print" class="btn-3d theme-amber px-4 py-2 text-xs sm:text-sm">🖨 Cetak Sekarang</button>
            <button type="button" id="close-card-modal" class="btn-3d theme-slate px-3.5 py-2 text-xs">Tutup</button>
          </div>
        </div>

        <div class="max-h-[65vh] overflow-y-auto p-3 rounded-2xl bg-slate-100 border border-slate-200">
          ${cardsGridHTML}
        </div>
      `, "max-w-4xl");

      document.getElementById("close-card-modal").onclick = closeModal;
      document.getElementById("btn-execute-card-print").onclick = () => {
        const sheet = document.getElementById("card-print-sheet");
        sheet.innerHTML = `
          <div class="p-6">
            <div class="text-center mb-4 pb-2 border-b-2 border-slate-900">
              <h2 class="font-display font-extrabold text-base uppercase">${escapeHtml(state.settings.schoolName)} — LABEL KARTU INVENTARIS BARANG</h2>
            </div>
            ${cardsGridHTML}
          </div>
        `;
        document.body.classList.add("print-card-mode");
        window.print();
        setTimeout(() => {
          document.body.classList.remove("print-card-mode");
          sheet.innerHTML = "";
        }, 500);
      };
    }

    function bindInventarisEvents() {
      const searchEl = document.getElementById("inv-search-input");
      if (searchEl) {
        searchEl.oninput = (e) => {
          state.searchInventory = e.target.value;
          renderCurrentView();
        };
      }
      const catEl = document.getElementById("inv-filter-cat");
      if (catEl) {
        catEl.onchange = (e) => {
          state.filterCategory = e.target.value;
          renderCurrentView();
        };
      }
      const condEl = document.getElementById("inv-filter-cond");
      if (condEl) {
        condEl.onchange = (e) => {
          state.filterCondition = e.target.value;
          renderCurrentView();
        };
      }

      const btnPrintAll = document.getElementById("btn-print-all-cards");
      if (btnPrintAll) {
        btnPrintAll.onclick = () => openInventoryCardPrintModal(state.inventory);
      }

      const btnAdd = document.getElementById("btn-add-inventory");
      if (btnAdd) {
        btnAdd.onclick = () => requireAdminAction(() => openInventoryFormModal(null));
      }

      const btnSeed = document.getElementById("btn-seed-data");
      if (btnSeed) btnSeed.onclick = () => seedSampleDataToDatabase();

      document.querySelectorAll("[data-card-inv]").forEach((btn) => {
        btn.onclick = () => {
          const item = state.inventory.find((i) => i.id === btn.getAttribute("data-card-inv"));
          if (item) openInventoryCardPrintModal([item]);
        };
      });

      document.querySelectorAll("[data-edit-inv]").forEach((btn) => {
        btn.onclick = () => {
          const item = state.inventory.find((i) => i.id === btn.getAttribute("data-edit-inv"));
          if (item) requireAdminAction(() => openInventoryFormModal(item));
        };
      });

      document.querySelectorAll("[data-del-inv]").forEach((btn) => {
        btn.onclick = () => {
          const item = state.inventory.find((i) => i.id === btn.getAttribute("data-del-inv"));
          if (item) {
            requireAdminAction(() => {
              showConfirmModal(
                "Hapus Data Inventaris?",
                `Anda yakin ingin menghapus "${item.name}" (${item.code}) dari sistem Sarpras?`,
                () => deleteInventoryItem(item)
              );
            });
          }
        };
      });
    }

      const modeSwitcherHTML = `

            <h3 class="font-display font-extrabold text-base text-slate-900">
              ${isAdminTab ? "🛡️ Versi Admin Sarpras (Verifikasi & Kontrol Penuh)" : "🧑‍🏫 Versi Pengunjung / Peminjam (Portal Guru & Umum)"}
            </h3>
          </div>

          <div class="flex flex-wrap gap-2.5">
            <button type="button" id="btn-mode-borrower" class="btn-3d px-4 py-2.5 text-xs ${
              !isAdminTab ? "theme-emerald" : "theme-slate"
            }">
              🧑‍🏫 Versi Pengunjung / Peminjam
            </button>

      const defaultEnd = toLocalInput(new Date(now.getTime() + 2 * 3600000));
      const romanMonths = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];

                  <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Nama Guru / Peminjam *</label>
                  <input name="borrowerName" type="text" required placeholder="Contoh: Dra. Ratna Sari, M.Pd." class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 focus:border-emerald-500 focus:outline-none text-sm font-semibold" />

      const defaultStart = toLocalInput(now);
      const defaultEnd = toLocalInput(new Date(now.getTime() + 2 * 3600000));
      const romanMonths = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
      const autoLetter = `${String(state.loans.length + 1).padStart(3, "0")}/SARPRAS/${romanMonths[now.getMonth()]}/${now.getFullYear()}`;

      openModal(`
        <div class="flex items-center justify-between mb-5">

            </div>
            <div>
              <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Status Peminjaman</label>
              <select name="status" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 focus:border-emerald-500 focus:outline-none text-sm font-bold bg-white">

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Mata Pelajaran / Jabatan</label>

            <div>
              <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Waktu Selesai</label>
              <input name="endTime" type="datetime-local" required value="${escapeHtml(editLoan ? editLoan.endTime : defaultEnd)}" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 focus:border-emerald-500 focus:outline-none text-sm font-semibold" />

          </div>

          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Keperluan / Kegiatan</label>

      `);

      document.getElementById("close-loan-modal").onclick = closeModal;
      document.getElementById("cancel-loan-modal").onclick = closeModal;
      document.getElementById("form-loan").onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = Object.fromEntries(fd.entries());
        closeModal();
        await saveLoan(data, editLoan ? editLoan.id : null);
      };
    }

    function bindPeminjamanEvents() {
      const btnBorrowerMode = document.getElementById("btn-mode-borrower");
      if (btnBorrowerMode) {
        btnBorrowerMode.onclick = () => {
          state.loanViewMode = "borrower";
          renderCurrentView();
        };
      }

      const btnAdminMode = document.getElementById("btn-mode-admin");
      if (btnAdminMode) {
        btnAdminMode.onclick = () => {
          requireAdminAction(() => {
            state.loanViewMode = "admin";
            renderCurrentView();
          });
        };
      }

      const borrowerForm = document.getElementById("form-borrower-submit");
      if (borrowerForm) {
        borrowerForm.onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const data = Object.fromEntries(fd.entries());
          state.preselectedBorrowerItemId = "";
          await saveLoan(data, null);
          showToast(
            "Pengajuan Terkirim",
            "Silakan cetak surat konfirmasi Anda agar dapat segera ditindaklanjuti oleh Admin Sarpras.",
            "success"
          );
        };
      }

      const searchEl = document.getElementById("loan-search-input");
      if (searchEl) {
        searchEl.oninput = (e) => {
          state.searchLoan = e.target.value;
          renderCurrentView();
        };
      }
      const statusEl = document.getElementById("loan-filter-status");
      if (statusEl) {
        statusEl.onchange = (e) => {
          state.filterLoanStatus = e.target.value;
          renderCurrentView();
        };
      }
      const btnAdd = document.getElementById("btn-add-loan");
      if (btnAdd) btnAdd.onclick = () => openLoanFormModal(null);

      document.querySelectorAll("[data-approve-loan]").forEach((btn) => {
        btn.onclick = () => quickUpdateLoanStatus(btn.getAttribute("data-approve-loan"), "Disetujui / Aktif");
      });

      document.querySelectorAll("[data-reject-loan]").forEach((btn) => {

      document.querySelectorAll("[data-print-loan]").forEach((btn) => {
        btn.onclick = () => {
          state.selectedLetterLoanId = btn.getAttribute("data-print-loan");
          setActiveMenu("surat");
        };

      document.querySelectorAll("[data-edit-loan]").forEach((btn) => {
        btn.onclick = () => {
          const loan = state.loans.find((l) => l.id === btn.getAttribute("data-edit-loan"));
          if (loan) openLoanFormModal(loan);

      });

      document.querySelectorAll("[data-del-loan]").forEach((btn) => {
        btn.onclick = () => {
          const loan = state.loans.find((l) => l.id === btn.getAttribute("data-del-loan"));

              "Hapus Data Peminjaman?",
              `Anda yakin ingin menghapus transaksi surat "${loan.letterNumber}" atas nama ${loan.borrowerName}?`,
              () => deleteLoan(loan)
            );
          }
        };
      });
    }

    function bindSuratEvents() {

          renderCurrentView();

      }

      const btnApprove = document.getElementById("btn-letter-approve");
      if (btnApprove && activeLoan) {
        btnApprove.onclick = () => quickUpdateLoanStatus(activeLoan.id, "Disetujui / Aktif");

      const btnLoginApprove = document.getElementById("btn-letter-login-approve");
      if (btnLoginApprove && activeLoan) {

          openAdminLoginModal(() => quickUpdateLoanStatus(activeLoan.id, "Disetujui / Aktif"));
      }

      const btnCopyWa = document.getElementById("btn-copy-wa");

        btnCopyWa.onclick = () => {
          const waText =
            `*KONFIRMASI PEMINJAMAN SARPRAS*\n` +
            `Instansi: ${state.settings.schoolName}\n` +
            `No. Surat: ${activeLoan.letterNumber}\n` +
            `Peminjam: ${activeLoan.borrowerName}\n` +

            `Status: ${activeLoan.status}\n` +
            `Mohon tindak lanjut Admin Sarpras. Terima kasih.`;

          const ta = document.createElement("textarea");
          ta.value = waText;
          document.body.appendChild(ta);

          try {
            document.execCommand("copy");

      if (btnPrint) {
        btnPrint.onclick = () => window.print();

                              item.availableQty > 0 ? "bg-emerald-500 text-white" : "bg-rose-600 text-white"

                              ${item.availableQty > 0 ? `${item.availableQty} Tersedia` : "Dipakai Penuh"}
                            </span>
                          </div>

                          <!-- Informasi Aset -->
                          <div class="p-5">
                            <span class="text-[11px] font-bold uppercase tracking-wider text-rose-600">${escapeHtml(item.category)}</span>
                            <h4 class="font-display font-extrabold text-base text-slate-900 mt-0.5 line-clamp-2">${escapeHtml(item.name)}</h4>
                            <p class="text-xs text-slate-500 mt-1.5 line-clamp-2">${escapeHtml(item.description || "Fasilitas inventaris sekolah terawat.")}</p>
                            <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-600">
                              <span>📍 ${escapeHtml(item.location)}</span>
                              <span class="font-bold">${escapeHtml(item.condition)}</span>
                            </div>
                          </div>
                        </div>

                        <div class="px-5 pb-5 flex flex-wrap gap-2">
                          <button type="button" data-gal-detail="${item.id}" class="btn-3d theme-slate flex-1 py-2 text-xs">Detail</button>
                          <button type="button" data-gal-card="${item.id}" class="btn-3d theme-amber px-3 py-2 text-xs" title="Cetak Kartu Inventaris">🪪 Kartu</button>
                          <button type="button" data-gal-borrow="${item.id}" class="btn-3d theme-rose flex-1 py-2 text-xs" ${item.availableQty === 0 ? "disabled style='opacity:0.5;cursor:not-allowed'" : ""}>
                            Pinjam
                          </button>
                        </div>
                      </div>
                    `;
                  })
                  .join("")}
              </div>`
        }
      `;
    }

    function openGalleryDetailModal(item) {

      const hasPhoto = item.imageUrl && item.imageUrl.trim().length > 4;

      openModal(`
        <div class="flex items-center justify-between mb-4">
          <span class="px-3 py-1 rounded-xl bg-rose-100 text-rose-700 font-mono text-xs font-bold">${escapeHtml(item.code)}</span>
          <button type="button" id="close-gal-modal" class="text-slate-400 hover:text-slate-700 text-2xl font-bold">&times;</button>
        </div>
        <div class="h-52 rounded-2xl bg-gradient-to-br ${illus.bg} flex items-center justify-center overflow-hidden mb-5">
          ${
            hasPhoto
              ? `<img src="${escapeHtml(item.imageUrl)}" alt="${escapeHtml(item.name)}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                 <div style="display:none" class="w-full h-full items-center justify-center">${illus.svg}</div>`
              : illus.svg
          }
        </div>
        <h3 class="font-display font-extrabold text-2xl text-slate-900">${escapeHtml(item.name)}</h3>
        <p class="text-xs font-bold text-rose-600 uppercase mt-1">${escapeHtml(item.category)} • 📍 ${escapeHtml(item.location)}</p>
        <p class="text-sm text-slate-600 mt-3 leading-relaxed">${escapeHtml(item.description || "-")}</p>
        <div class="grid grid-cols-3 gap-3 my-5 p-4 rounded-2xl bg-slate-50 border border-slate-200 text-center">
          <div>
            <div class="text-xs text-slate-400 font-bold">Total Unit</div>
            <div class="font-display font-extrabold text-lg text-slate-900">${item.totalQty}</div>
          </div>
          <div>
            <div class="text-xs text-slate-400 font-bold">Tersedia</div>
            <div class="font-display font-extrabold text-lg text-emerald-600">${item.availableQty}</div>
          </div>
          <div>
            <div class="text-xs text-slate-400 font-bold">Kondisi</div>
            <div class="font-display font-extrabold text-sm text-slate-800 mt-1">${escapeHtml(item.condition)}</div>
          </div>
        </div>
        <div class="flex justify-end gap-3">
          <button type="button" id="btn-gal-modal-card" class="btn-3d theme-amber px-4 py-2.5 text-sm">🪪 Cetak Kartu</button>
          <button type="button" id="close-gal-modal-2" class="btn-3d theme-slate px-5 py-2.5 text-sm">Tutup</button>
        </div>
      `);

      document.getElementById("close-gal-modal").onclick = closeModal;
      document.getElementById("close-gal-modal-2").onclick = closeModal;
      document.getElementById("btn-gal-modal-card").onclick = () => {
        closeModal();

    function bindGaleriEvents() {
      document.querySelectorAll("[data-gal-cat]").forEach((btn) => {
        btn.onclick = () => {
          state.filterGalleryCategory = btn.getAttribute("data-gal-cat");
          renderCurrentView();
        };
      });
      const availSel = document.getElementById("gal-avail-filter");
      if (availSel) {
        availSel.onchange = (e) => {
          state.filterGalleryAvailability = e.target.value;
          renderCurrentView();
        };
      }
      document.querySelectorAll("[data-gal-detail]").forEach((btn) => {
        btn.onclick = () => {
          const item = state.inventory.find((i) => i.id === btn.getAttribute("data-gal-detail"));
          if (item) openGalleryDetailModal(item);
        };
      });
      document.querySelectorAll("[data-gal-card]").forEach((btn) => {
        btn.onclick = () => {
          const item = state.inventory.find((i) => i.id === btn.getAttribute("data-gal-card"));
          if (item) openInventoryCardPrintModal([item]);
        };
      });
      document.querySelectorAll("[data-gal-borrow]").forEach((btn) => {
        btn.onclick = () => {
          const itemId = btn.getAttribute("data-gal-borrow");
          state.preselectedBorrowerItemId = itemId;
          state.loanViewMode = "borrower";
          setActiveMenu("peminjaman");
          showToast("Formulir Peminjaman Siap", "Silakan lengkapi identitas peminjam di bawah ini.", "info");
        };
      });
    }

    function bindSettingEvents() {

      }

      if (form) {

          e.preventDefault();

          await saveSettings(Object.fromEntries(fd.entries()));

      if (btnSeed) {
        btnSeed.onclick = () => seedSampleDataToDatabase();
      }

    // =========================================================================
    // 9. TIMER REALTIME GLOBAL (JAM DIGITAL & LIVE COUNTDOWN PEMAKAIAN GURU)
    // =========================================================================
    function tickClockAndCountdowns() {
      const now = new Date();
      const timeEl = document.getElementById("live-clock-time");
      const dateEl = document.getElementById("live-clock-date");

      if (timeEl) {
        timeEl.textContent = now.toLocaleTimeString("id-ID", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
      }
      if (dateEl) {
        dateEl.textContent = now.toLocaleDateString("id-ID", {
          weekday: "long",
          day: "numeric",
          month: "short",
          year: "numeric"
        });
      }

      document.querySelectorAll("[data-realtime-card]").forEach((card) => {
        const startMs = new Date(card.getAttribute("data-start")).getTime();
        const endMs = new Date(card.getAttribute("data-end")).getTime();
        const nowMs = now.getTime();

        const countdownEl = card.querySelector(".rt-countdown");
        const progressEl = card.querySelector(".rt-progress");
        const badgeEl = card.querySelector(".rt-badge");

        if (!countdownEl || isNaN(endMs)) return;

        const diffMs = endMs - nowMs;
        const totalDuration = Math.max(1, endMs - (isNaN(startMs) ? endMs - 3600000 : startMs));
        const elapsed = Math.max(0, nowMs - (isNaN(startMs) ? endMs - 3600000 : startMs));
        const pct = Math.min(100, Math.max(4, Math.round((elapsed / totalDuration) * 100)));

        if (progressEl) progressEl.style.width = `${pct}%`;

        if (diffMs <= 0) {
          const overSec = Math.floor(Math.abs(diffMs) / 1000);
          const oh = String(Math.floor(overSec / 3600)).padStart(2, "0");
          const om = String(Math.floor((overSec % 3600) / 60)).padStart(2, "0");
          const os = String(overSec % 60).padStart(2, "0");
          countdownEl.textContent = `LEWAT WAKTU (+${oh}:${om}:${os})`;
          countdownEl.className = "rt-countdown font-display font-extrabold text-xl sm:text-2xl text-rose-400 tracking-wider";
          if (badgeEl) {
            badgeEl.textContent = "PERLU DIKEMBALIKAN";
            badgeEl.className = "rt-badge px-3 py-1 rounded-full bg-rose-100 text-rose-800 text-xs font-extrabold";
          }
        } else {
          const remSec = Math.floor(diffMs / 1000);
          const h = String(Math.floor(remSec / 3600)).padStart(2, "0");
          const m = String(Math.floor((remSec % 3600) / 60)).padStart(2, "0");
          const s = String(remSec % 60).padStart(2, "0");
          countdownEl.textContent = `${h}j : ${m}m : ${s}d`;

          if (remSec <= 900) {
            countdownEl.className = "rt-countdown font-display font-extrabold text-2xl sm:text-3xl text-amber-300 tracking-wider";
            if (badgeEl) {
              badgeEl.textContent = "SEGERA SELESAI";
              badgeEl.className = "rt-badge px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-extrabold";
            }
          }
        }
      });
    }

    // =========================================================================
    // 10. EVENT BOOTSTRAP SAAT HALAMAN DIMUAT
    // =========================================================================
    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("mobile-menu-btn").onclick = openMobileSidebar;
      document.getElementById("close-sidebar-btn").onclick = closeMobileSidebar;
      document.getElementById("sidebar-backdrop").onclick = closeMobileSidebar;

      document.getElementById("modal-root").onclick = (e) => {
        if (e.target.id === "modal-root") closeModal();
      };

      tickClockAndCountdowns();
      setInterval(tickClockAndCountdowns, 1000);

      renderAuthUI();
      setActiveMenu("inventaris");
      initFirebaseBackend();
    });
  </script>
